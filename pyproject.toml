[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "end-of-10"
version = "0.1.0"
description = "Safe prototype of a Linux storage sanitisation utility"
requires-python = ">=3.10"

[project.scripts]
endof10 = "endof10.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
